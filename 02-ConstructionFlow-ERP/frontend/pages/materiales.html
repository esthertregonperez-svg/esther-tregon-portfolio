<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materiales | ConstructionFlow ERP</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/modulo.css">
</head>
<body>

  <div class="app">
    <header class="cabecera" id="cabecera"></header>

    <div class="app__cuerpo">
      <nav class="menu" id="menu"></nav>

      <main class="contenido">
        <div class="modulo__cabecera">
          <div>
            <h1 class="contenido__titulo">Materiales</h1>
            <p class="contenido__subtitulo" id="contador"></p>
          </div>
          <button class="boton boton--primario" id="boton-nuevo">Nuevo material</button>
        </div>

        <div class="modulo__barra">
          <input type="search" id="buscador" class="modulo__buscador"
                 placeholder="Buscar por material, categoría o proveedor...">
          <select id="filtro-estado" class="modulo__buscador" style="flex:0 0 auto; min-width:160px;">
            <option value="activos">Activos</option>
            <option value="baja">De baja</option>
            <option value="todos">Todos</option>
          </select>
        </div>

        <div class="tabla__contenedor">
          <table class="tabla">
            <thead>
              <tr>
                <th>Material</th>
                <th>Categoría</th>
                <th>Proveedor</th>
                <th>Unidad</th>
                <th>Precio</th>
                <th>Stock mín.</th>
                <th>Estado</th>
                <th class="tabla__acciones">Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-cuerpo"></tbody>
          </table>
          <p class="tabla__vacio" id="mensaje-vacio" hidden>No se encontraron materiales.</p>
        </div>
      </main>
    </div>

    <footer class="pie">
      <span>© 2026 Construcciones Pérez</span>
      <span>Desarrollado por <strong>Código Azul</strong></span>
    </footer>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal__caja">
      <div class="modal__cabecera">
        <h2 class="modal__titulo" id="modal-titulo">Nuevo material</h2>
        <button class="modal__cerrar" id="modal-cerrar">&times;</button>
      </div>

      <form class="formulario" id="formulario" novalidate>
        <input type="hidden" id="id_material">

        <div class="campo">
          <label class="campo__etiqueta" for="nombre_material">Nombre del material *</label>
          <input class="campo__control" type="text" id="nombre_material" required>
          <span class="campo__error" id="error-nombre_material"></span>
        </div>

        <div class="campo">
          <label class="campo__etiqueta" for="id_categoria_material">Categoría *</label>
          <select class="campo__control" id="id_categoria_material" required>
            <option value="">Selecciona una categoría...</option>
          </select>
          <span class="campo__error" id="error-id_categoria_material"></span>
        </div>

        <div class="campo">
          <label class="campo__etiqueta" for="id_proveedor">Proveedor *</label>
          <select class="campo__control" id="id_proveedor" required>
            <option value="">Selecciona un proveedor...</option>
          </select>
          <span class="campo__error" id="error-id_proveedor"></span>
        </div>

        <div class="campo">
          <label class="campo__etiqueta" for="unidad_medida">Unidad de medida *</label>
          <select class="campo__control" id="unidad_medida" required>
            <option value="kg">Kilogramos (kg)</option>
            <option value="uds">Unidades (uds)</option>
            <option value="m">Metros (m)</option>
            <option value="m2">Metros cuadrados (m2)</option>
            <option value="m3">Metros cúbicos (m3)</option>
            <option value="l">Litros (l)</option>
            <option value="saco">Saco</option>
            <option value="palet">Palet</option>
          </select>
          <span class="campo__error" id="error-unidad_medida"></span>
        </div>

        <div class="campo">
          <label class="campo__etiqueta" for="precio_unitario">Precio unitario (€)</label>
          <input class="campo__control" type="number" step="0.01" min="0" id="precio_unitario">
          <span class="campo__error" id="error-precio_unitario"></span>
        </div>

        <div class="campo">
          <label class="campo__etiqueta" for="stock_minimo">Stock mínimo</label>
          <input class="campo__control" type="number" step="0.01" min="0" id="stock_minimo">
          <span class="campo__error" id="error-stock_minimo"></span>
        </div>

        <div class="campo">
          <label class="campo__etiqueta" for="descripcion">Descripción</label>
          <input class="campo__control" type="text" id="descripcion">
        </div>

        <div class="campo">
          <label class="campo__etiqueta" for="activo">Estado *</label>
          <select class="campo__control" id="activo" required>
            <option value="1">Alta</option>
            <option value="0">Baja</option>
          </select>
        </div>

        <p class="formulario__error" id="error-general" hidden></p>

        <div class="modal__pie">
          <button type="button" class="boton boton--secundario" id="boton-cancelar">Cancelar</button>
          <button type="submit" class="boton boton--primario" id="boton-guardar">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth-guard.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/materiales.js"></script>
</body>
</html>
