<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Empleados | ConstructionFlow ERP</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/modulo.css">
</head>
<body>

  <div class="app">
    <header class="cabecera" id="cabecera"></header>

    <div class="app__cuerpo">
      <nav class="menu" id="menu"></nav>

      <main class="contenido">
        <div class="modulo__cabecera">
          <div>
            <h1 class="contenido__titulo">Empleados</h1>
            <p class="contenido__subtitulo" id="contador"></p>
          </div>
          <button class="boton boton--primario" id="boton-nuevo">Nuevo empleado</button>
        </div>

        <div class="modulo__barra">
          <input type="search" id="buscador" class="modulo__buscador"
                 placeholder="Buscar por nombre, apellidos o DNI...">
          <select id="filtro-estado" class="modulo__buscador" style="flex:0 0 auto; min-width:160px;">
            <option value="activos">Activos</option>
            <option value="baja">De baja</option>
            <option value="todos">Todos</option>
          </select>
        </div>

        <div class="tabla__contenedor">
          <table class="tabla">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Apellidos</th>
                <th>DNI</th>
                <th>Categoría</th>
                <th>Teléfono</th>
                <th>Salario base</th>
                <th>Estado</th>
                <th class="tabla__acciones">Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-cuerpo"></tbody>
          </table>
          <p class="tabla__vacio" id="mensaje-vacio" hidden>No se encontraron empleados.</p>
        </div>
      </main>
    </div>

    <footer class="pie">
      <span>© 2026 Construcciones Pérez</span>
      <span>Desarrollado por <strong>Código Azul</strong></span>
    </footer>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal__caja">
      <div class="modal__cabecera">
        <h2 class="modal__titulo" id="modal-titulo">Nuevo empleado</h2>
        <button class="modal__cerrar" id="modal-cerrar">&times;</button>
      </div>

      <form class="formulario" id="formulario" novalidate>
        <input type="hidden" id="id_empleado">

        <div class="campo">
          <label class="campo__etiqueta" for="nombre">Nombre *</label>
          <input class="campo__control" type="text" id="nombre" required>
          <span class="campo__error" id="error-nombre"></span>
        </div>

        <div class="campo">
          <label class="campo__etiqueta" for="apellidos">Apellidos *</label>
          <input class="campo__control" type="text" id="apellidos" required>
          <span class="campo__error" id="error-apellidos"></span>
        </div>

        <div class="campo">
          <label class="campo__etiqueta" for="dni">DNI *</label>
          <input class="campo__control" type="text" id="dni" required>
          <span class="campo__error" id="error-dni"></span>
        </div>

        <div class="campo">
          <label class="campo__etiqueta" for="id_categoria_empleado">Categoría laboral *</label>
          <select class="campo__control" id="id_categoria_empleado" required>
            <option value="">Selecciona una categoría...</option>
          </select>
          <span class="campo__error" id="error-id_categoria_empleado"></span>
        </div>

        <div class="campo">
          <label class="campo__etiqueta" for="fecha_alta">Fecha de alta *</label>
          <input class="campo__control" type="date" id="fecha_alta" required>
          <span class="campo__error" id="error-fecha_alta"></span>
        </div>

        <div class="campo">
          <label class="campo__etiqueta" for="salario_base">Salario base (€)</label>
          <input class="campo__control" type="number" step="0.01" min="0" id="salario_base">
          <span class="campo__error" id="error-salario_base"></span>
        </div>

        <div class="campo">
          <label class="campo__etiqueta" for="telefono">Teléfono</label>
          <input class="campo__control" type="text" id="telefono">
        </div>

        <div class="campo">
          <label class="campo__etiqueta" for="email">Email</label>
          <input class="campo__control" type="email" id="email">
          <span class="campo__error" id="error-email"></span>
        </div>

        <div class="campo">
          <label class="campo__etiqueta" for="direccion">Dirección</label>
          <input class="campo__control" type="text" id="direccion">
        </div>

        <div class="campo">
          <label class="campo__etiqueta" for="activo">Estado *</label>
          <select class="campo__control" id="activo" required>
            <option value="1">Alta</option>
            <option value="0">Baja</option>
          </select>
        </div>

        <p class="formulario__error" id="error-general" hidden></p>

        <div class="modal__pie">
          <button type="button" class="boton boton--secundario" id="boton-cancelar">Cancelar</button>
          <button type="submit" class="boton boton--primario" id="boton-guardar">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth-guard.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/empleados.js"></script>
</body>
</html>
