<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock | ConstructionFlow ERP</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/modulo.css">
</head>
<body>

  <div class="app">
    <header class="cabecera" id="cabecera"></header>

    <div class="app__cuerpo">
      <nav class="menu" id="menu"></nav>

      <main class="contenido">
        <div class="modulo__cabecera">
          <div>
            <h1 class="contenido__titulo">Stock de almacén</h1>
            <p class="contenido__subtitulo" id="contador"></p>
          </div>
          <div class="tabla__acciones">
            <button class="boton boton--primario" id="boton-entrada-general">Registrar entrada</button>
            <button class="boton boton--secundario" id="boton-salida-general">Registrar salida</button>
          </div>
        </div>

        <div class="modulo__barra">
          <input type="search" id="buscador" class="modulo__buscador"
                 placeholder="Buscar por material, categoría o proveedor...">
        </div>

        <div class="tabla__contenedor">
          <table class="tabla">
            <thead>
              <tr>
                <th>Material</th>
                <th>Categoría</th>
                <th>Unidad</th>
                <th>Disponible</th>
                <th>Stock mín.</th>
                <th>Ubicación</th>
                <th class="tabla__acciones">Movimientos</th>
              </tr>
            </thead>
            <tbody id="tabla-cuerpo"></tbody>
          </table>
          <p class="tabla__vacio" id="mensaje-vacio" hidden>No se encontraron materiales.</p>
        </div>
      </main>
    </div>

    <footer class="pie">
      <span>© 2026 Construcciones Pérez</span>
      <span>Desarrollado por <strong>Código Azul</strong></span>
    </footer>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal__caja">
      <div class="modal__cabecera">
        <h2 class="modal__titulo" id="modal-titulo">Registrar movimiento</h2>
        <button class="modal__cerrar" id="modal-cerrar">&times;</button>
      </div>

      <form class="formulario" id="formulario" novalidate>
        <input type="hidden" id="id_material_hidden">
        <input type="hidden" id="tipo_movimiento">

        <!-- Desplegable de material: solo se usa/muestra cuando el movimiento
             se abre desde los botones de arriba (material aun sin elegir). -->
        <div class="campo" id="campo-select-material">
          <label class="campo__etiqueta" for="select_material">Material *</label>
          <select class="campo__control" id="select_material">
            <option value="">Selecciona un material...</option>
          </select>
          <span class="campo__error" id="error-select_material"></span>
        </div>

        <p class="modulo__info" id="info-material"></p>

        <div class="campo">
          <label class="campo__etiqueta" for="cantidad">Cantidad *</label>
          <input class="campo__control" type="number" step="0.01" min="0" id="cantidad" required>
          <span class="campo__error" id="error-cantidad"></span>
        </div>

        <div class="campo">
          <label class="campo__etiqueta" for="ubicacion_almacen">Ubicación (opcional)</label>
          <input class="campo__control" type="text" id="ubicacion_almacen">
        </div>

        <p class="formulario__error" id="error-general" hidden></p>

        <div class="modal__pie">
          <button type="button" class="boton boton--secundario" id="boton-cancelar">Cancelar</button>
          <button type="submit" class="boton boton--primario" id="boton-guardar">Registrar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth-guard.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/stock.js"></script>
</body>
</html>
